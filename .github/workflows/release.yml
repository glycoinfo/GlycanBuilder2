name: Release GlycanBuilder2

on:
  #push:
  #  branches: [ main , develop ]
  #  tags: [ 'v*' ]
  #pull_request:
  #  branches: [ main ]
  workflow_dispatch:

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  # Nothing is built until the suite passes. The installer workflows all build with -DskipTests, so
  # without this job a release could publish - and did - without a single test having run in CI.
  test:
    uses: ./.github/workflows/tests.yml

  build-installer-linux:
    needs: test
    uses: ./.github/workflows/jpackage_installer_linux.yml

  build-installer-macos:
    needs: test
    uses: ./.github/workflows/jpackage_installer_macos.yml
    secrets: inherit

  build-installer-windows:
    needs: test
    uses: ./.github/workflows/jpackage_installer_windows.yml

  build-installer-rpm:
    needs: test
    uses: ./.github/workflows/jpackage_installer_rpm.yml

  release:
    needs: [build-installer-linux, build-installer-macos, build-installer-windows, build-installer-rpm]
    runs-on: ubuntu-latest

    steps:
      - name: Download installer artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true
          pattern: '!glycanbuilder2-installer-windows'

      - name: List downloaded artifacts
        run: |
          find artifacts -type f -name "*" | sort

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: true
          generate_release_notes: true
          body: |
            ## Windows
            Install GlycanBuilder2 from the Microsoft Store:
            https://apps.microsoft.com/detail/9pp6bsnx71jl
          # Attach installers by extension. `artifacts/*` attached whatever the
          # download step happened to fetch, and once tests.yml began running as
          # part of the release that included the surefire-reports artifact --
          # v1.39.0 went out with 92 test reports hanging off it. Naming the
          # extensions keeps a release to the things people install, whatever
          # else future jobs leave in the directory.
          #
          # Windows is deliberately absent: it ships through the Microsoft Store.
          files: |
            artifacts/*.dmg
            artifacts/*.deb
            artifacts/*.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
